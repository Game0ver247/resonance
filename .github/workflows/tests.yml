name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension
        run: python build.py
      - name: JavaScript regressions
        run: npm test
      - name: Maintenance and native platform checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build-extension.cmd
          if errorlevel 1 exit /b 1
          call resonance.cmd --help
          if errorlevel 1 exit /b 1
      - name: Verify bundle is reproducible
        run: git diff --exit-code -- resonanceDisplay.js

      - name: Verify Linux launchers
        if: runner.os == 'Linux'
        run: |
          sh -n resonance.sh build-extension.sh
          ./build-extension.sh
          ./resonance.sh --help
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install test runtimes in container
        run: dnf -y install git python3 nodejs npm tar gzip
      - uses: actions/checkout@v4
      - name: Fedora regression checks
        run: |
          sha256sum resonanceDisplay.js > /tmp/resonance-bundle.sha256
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm test
          sh -n resonance.sh build-extension.sh
          ./resonance.sh --help
          ./build-extension.sh
          sha256sum -c /tmp/resonance-bundle.sha256
